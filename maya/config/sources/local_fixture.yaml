# LOCAL TEST FIXTURE — this is NOT Caterpillar SIS.
#
# A second registered source, pointed at scripts/capture/fixture.html served
# locally. Its purpose is to exercise the entire chain end to end with a real
# browser: Maya → gateway → Playwright worker → a real page → real extraction →
# normalization → validation → persistence → Maya.
#
# Every selector below was CAPTURED and verified from that page by
# scripts/capture/capture_selectors.py --self-test. None is guessed.
#
# It is disabled unless MAYA_ENABLE_FIXTURE_SOURCE=true, and its label carries
# the warning into every answer, card and audit row, so fixture data can never
# be mistaken for equipment data from Caterpillar.
source_id: local_fixture
label: "Local test fixture (NOT Caterpillar SIS)"
precedence: 900                    # never chosen by `auto`; must be asked for
base_url: http://127.0.0.1:5173/fixture.html
selector_version: fixture-captured-v1

auth:
  kind: form
  secret_ref: env://MAYA_FIXTURE
  login_host_markers: ["page-login"]
  session_slots: ["default"]
  session_max_age_s: 3600

routes:
  search: "/search"

ready_markers:
  app_shell: '[data-testid="app-shell"]'
  authenticated: "#user-menu"        # only rendered after sign-in
  search_page: "#search-heading"
  detail_page: "#detail-title"

challenge_markers: []

selectors:
  login:
    username: "#mat-input-0"
    password: "#mat-input-1"
    submit: "#submit-9931"
    error: "#login-error"
  search:
    input: 'input[name="serialNumber"]'
    submit: '[data-testid="serial-search-submit"]'
    results: "#results-wrap"
    first_result: "#results-body > tr.result-row"
    no_results_marker: "#no-results"
  detail:
    equipment_model: "#fld-model"
    equipment_type: '[data-testid="equipment-type"]'
    build_date: '[data-testid="equipment-detail-page"] > div.kv:nth-of-type(3) > span.detail-value'
    engine_family: 'span[aria-label="Engine family"]'
    parts_manual_url: "#parts-manual-link"
    spec_rows: '[data-testid="equipment-detail-page"] > table.spec-table > tbody > tr.spec-row'
    spec_cell: "td"

extraction:
  strategy: dom_only
  required_fields: [equipment_model]

field_map:
  equipment_model: equipment_model
  equipment_type: equipment_type
  build_date: build_date
  engine_family: engine_family
  parts_manual_url: parts_manual_url

politeness:
  min_delay_ms: 0
  max_concurrent: 2
