# Caterpillar SIS2 source contract.
#
# TODO_CAPTURE values are intentional: DOM selectors must be captured from a real
# authenticated SIS2 session by an engineer (scripts/capture_selectors.py) and
# reviewed. The adapter refuses to run with placeholders and raises
# WEBSITE_CHANGED rather than guessing — a guessed selector is how a scraper
# starts returning confident nonsense.
source_id: cat_sis
label: Caterpillar SIS
precedence: 10
base_url: https://sis2.cat.com/#/
selector_version: v1-unconfirmed

auth:
  kind: oidc_redirect                  # CWS / Cat Login
  secret_ref: env://SIS                # SIS_USERNAME / SIS_PASSWORD;
                                       # override: MAIA_SIS_SECRET_REF=vault://kv/maia/cat_sis
  login_host_markers: ["signin.cat.com", "login.cat.com", "/cws", "authenticate"]
  session_slots: ["default"]
  session_max_age_s: 28800

routes:
  search: "/search"

# Application-level "the app is usable" signals. Never networkidle, never sleep().
ready_markers:
  app_shell: TODO_CAPTURE
  authenticated: TODO_CAPTURE   # an element that exists ONLY when signed in
  search_page: TODO_CAPTURE
  detail_page: TODO_CAPTURE

challenge_markers:                     # presence ⇒ CAPTCHA_DETECTED, hard stop
  - "iframe[src*='recaptcha']"
  - "#challenge-form"
  - "[data-testid='bot-challenge']"

selectors:
  consent:
    accept: TODO_CAPTURE       # cookie banner button; it overlays and eats clicks
  login:
    username: TODO_CAPTURE
    username_submit: TODO_CAPTURE   # two-step sign-in: advances to the password screen
    password: TODO_CAPTURE
    submit: TODO_CAPTURE
    error: TODO_CAPTURE
  nav:
    search_link: TODO_CAPTURE
    # SIS shows a record as tabs (Dashboard | Parts | Repair | Service …) and
    # the parts exist in the DOM only once Parts is open.
    parts_tab: TODO_CAPTURE
  search:
    input: TODO_CAPTURE
    submit: TODO_CAPTURE
    results: TODO_CAPTURE
    first_result: TODO_CAPTURE
    # Optional. Preferred proof of SERIAL_NOT_FOUND — but SIS navigates straight
    # to the record, so it has no empty state; then the record never rendering
    # is the proof instead.
    no_results_marker: TODO_CAPTURE
  detail:
    equipment_model: TODO_CAPTURE
    equipment_type: TODO_CAPTURE
    build_date: TODO_CAPTURE
    engine_family: TODO_CAPTURE
    parts_manual_url: TODO_CAPTURE
    operation_manual_url: TODO_CAPTURE
    spec_rows: TODO_CAPTURE
    spec_cell: TODO_CAPTURE   # derived from the captured row, never assumed
    # ── the equipment-details section, below the fold of the SIS content pane ──
    scroll_container: TODO_CAPTURE  # the pane that scrolls; NOT the browser window
    details_anchor: TODO_CAPTURE    # informational: the heading of the section.
                                    # The scroll itself targets
                                    # extraction.scroll.anchor_pattern, which is text.
    machine_serial_number: TODO_CAPTURE
    machine_build_date: TODO_CAPTURE
    engine_serial_number: TODO_CAPTURE
    engine_build_date: TODO_CAPTURE
    # ── the "Product - …" parts groups ──
    parts_group: TODO_CAPTURE       # e.g. "Product - Entire Group (<serial>)"
    parts_table: TODO_CAPTURE
    parts_header_cells: TODO_CAPTURE
    parts_rows: TODO_CAPTURE
    parts_cell: TODO_CAPTURE  # derived from the captured row, never assumed

extraction:
  strategy: dom_then_xhr               # the SPA's own JSON beats scraped text
  xhr_url_patterns:
    - "/api/.*(equipment|serial|machine|asset).*"
  required_fields: [machine_serial_number, machine_build_date,
                    engine_serial_number, engine_build_date]

  # The detail page renders inside its own scrolling pane. Nothing below its
  # fold exists until it is scrolled, so extraction scrolls the PANE (not the
  # window), waits for the SPA to settle, and only then reads.
  scroll:
    enabled: true
    #: the section that must be on screen before any value is read
    anchor_pattern: 'Machine\s+Serial\s+(?:Number|No\.?)'
    max_steps: 30
    step_pause_ms: 300
    settle_ms: 4000

  # The page's own wording for each field, as a pattern. These are labels, not
  # selectors and not values: SIS writes "<label> - <value>" inside a single
  # element, and the reader strips the label to get the value. When the captured
  # element holds only the value, nothing is stripped.
  detail_labels:
    machine_serial_number: 'Machine\s+Serial\s+(?:Number|No\.?)'
    machine_build_date: 'Machine\s+Build\s+Date'
    engine_serial_number: 'Engine\s+Serial\s+(?:Number|No\.?)'
    engine_build_date: 'Engine\s+Build\s+Date'

  # US date order, as SIS publishes it (MM/DD/YYYY). A value that settles its
  # own order — a day past the 12th — always wins over this setting.
  date_order: month_first

  # Which machine/engine values must equal the serial that was searched. A
  # mismatch means the wrong record was read, and the run fails rather than
  # answering about another machine.
  serial_cross_check: machine_serial_number

  parts:
    #: collect every "Product - …" group on the page, in page order
    all_groups: true
    max_rows_per_group: 500

# Source field name -> canonical schema field. This is the whole "mapping layer".
field_map:
  equipment_model: equipment_model
  equipment_type: equipment_type
  build_date: build_date
  engine_family: engine_family
  parts_manual_url: parts_manual_url
  operation_manual_url: operation_manual_url
  machine_serial_number: machine_serial_number
  machine_build_date: machine_build_date
  engine_serial_number: engine_serial_number
  engine_build_date: engine_build_date

politeness:
  min_delay_ms: 1500
  max_concurrent: 2
  nightly_cap: 4000
