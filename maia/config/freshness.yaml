# Freshness policy. Evaluated server-side by app/domain/freshness.py.
# Changing this file is a reviewed, deployed, auditable change — never a prompt edit.
default:
  ttl_days: 30
  hard_stale_days: 365
  negative_cache_ttl_days: 7
  on_stale: refresh_if_source_healthy   # serve_cache | refresh_if_source_healthy | force_refresh
  allow_stale_fallback: true

sources:
  cat_sis:
    ttl_days: 90          # build/spec data barely changes once a machine is built
    hard_stale_days: 730
    negative_cache_ttl_days: 7
  dealer_erp:
    ttl_days: 1           # ownership and contract state move daily
    hard_stale_days: 30

# Per-field classes, applied by the reader when composing an answer.
field_classes:
  static:
    fields: [build_date, engine_family, manufacturer, equipment_model, equipment_type]
    ttl_days: 3650
  volatile:
    fields: [parts_data, parts_manual_url, operation_manual_url]
    ttl_days: 30

overrides:
  - when: { reason: force_refresh, actor_role: engineer }
    then: { ttl_days: 0 }
  - when: { circuit_state: open }
    then: { on_stale: serve_cache }       # degrade to honest, labelled cache
  - when: { reason: backfill }
    then: { on_stale: refresh_if_source_healthy, allow_stale_fallback: false }
