services:
  maia-api:
    build: { context: ., dockerfile: services/automation/Dockerfile }
    ports: ["8080:8080"]
    environment:
      MAIA_ENVIRONMENT: dev
      MAIA_REPOSITORY: memory            # switch to snowflake with the vars below
      MAIA_ALLOW_LIVE_AUTOMATION: "false"
      MAIA_HEADLESS: "true"
      MAIA_CORS_ORIGINS: "http://localhost:5173"
    env_file: [config/.env]              # cp config/.env.example config/.env
    shm_size: 1gb                        # Chromium needs it; otherwise tabs crash
    volumes: ["artifacts:/var/maia/artifacts"]

  maia-worker:                           # same image, browser-heavy path only
    build: { context: ., dockerfile: services/automation/Dockerfile }
    command: ["python", "-m", "app.worker"]
    profiles: ["worker"]                 # enable once the queue is wired
    env_file: [config/.env]
    shm_size: 1gb
    volumes: ["artifacts:/var/maia/artifacts"]

volumes:
  artifacts:
