[project]
name = "service-intelligence"
version = "0.1.0"
description = "Snowflake-native service analysis, recommendation plan and governed AI assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "snowflake: live Snowflake test; runs only with RUN_SNOWFLAKE_TESTS=1",
  "e2e: browser test; needs Chromium",
]
