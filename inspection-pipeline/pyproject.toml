[project]
name = "inspection-pipeline"
version = "1.0.0"
description = "Daily inspection data collection pipeline into Snowflake"
requires-python = ">=3.11"

[tool.setuptools.package-data]
"app.warehouse" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: needs a local Chromium (skipped when unavailable)",
    "snowflake: needs a real Snowflake account (skipped unless RUN_SNOWFLAKE_TESTS=1)",
]
